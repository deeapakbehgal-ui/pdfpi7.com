<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merge PDF Tool - PDFPi7</title>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
}

.header{
background:#0d6efd;
color:white;
text-align:center;
padding:60px 20px;
}

.header h1{
font-size:48px;
margin:0;
}

.header p{
font-size:20px;
margin-top:10px;
}

.container{
max-width:900px;
margin:40px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.upload{
border:3px dashed #0d6efd;
padding:50px 20px;
text-align:center;
border-radius:15px;
}

input[type=file]{
margin:20px 0;
}

button{
background:#0d6efd;
color:white;
border:none;
padding:14px 30px;
font-size:18px;
border-radius:8px;
cursor:pointer;
margin:10px;
}

button:hover{
opacity:.9;
}

#status{
margin-top:20px;
font-weight:bold;
font-size:18px;
}
</style>
</head>

<body>

<div class="header">
<h1>Merge PDF Tool</h1>
<p>Combine multiple PDF files into one PDF</p>
</div>

<div class="container">
<div class="upload">

<h2>Select PDF Files</h2>

<input type="file" id="pdfFiles" multiple accept=".pdf">

<br>

<button onclick="mergePDFs()">Merge PDFs</button>

<button id="downloadBtn" style="display:none;">
Download PDF
</button>

<div id="status"></div>

</div>
</div>

<script>

let mergedBlob = null;

async function mergePDFs(){

const files = document.getElementById('pdfFiles').files;

if(files.length < 2){
alert('Please select at least 2 PDF files');
return;
}

document.getElementById('status').innerHTML =
'Processing... Please wait';

const mergedPdf = await PDFLib.PDFDocument.create();

for(const file of files){

const bytes = await file.arrayBuffer();

const pdf = await PDFLib.PDFDocument.load(bytes);

const pages = await mergedPdf.copyPages(
pdf,
pdf.getPageIndices()
);

pages.forEach(page => mergedPdf.addPage(page));
}

const mergedBytes = await mergedPdf.save();

mergedBlob = new Blob(
[mergedBytes],
{type:'application/pdf'}
);

document.getElementById('status').innerHTML =
'PDF Merged Successfully';

document.getElementById('downloadBtn').style.display =
'inline-block';
}

document.getElementById('downloadBtn')
.addEventListener('click', function(){

const link = document.createElement('a');

link.href = URL.createObjectURL(mergedBlob);

link.download = 'merged.pdf';

link.click();

});

</script>

</body>
</html>
