<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compress PDF</title>

<style>
body{
font-family:Arial,sans-serif;
text-align:center;
padding:30px;
background:#f5f5f5;
}
.container{
max-width:500px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}
input,button{
margin:10px;
padding:10px;
}
button{
background:#007bff;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}
</style>
</head>
<body>

<div class="container">
<h2>Compress PDF</h2>

<input type="file" id="pdfFile" accept=".pdf">

<br>

<button onclick="compressPDF()">Compress PDF</button>

<p id="status"></p>
</div>

<script>
function compressPDF(){
document.getElementById("status").innerHTML =
"PDF Compression browser me directly limited hoti hai. Advanced compression ke liye backend/API ki zarurat hogi.";
}
</script>

</body>
</html>
