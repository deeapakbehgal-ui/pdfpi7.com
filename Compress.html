<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compress PDF Tool</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:0;
}

.header{
background:#0d6efd;
color:white;
text-align:center;
padding:60px 20px;
}

.header h1{
font-size:50px;
margin-bottom:10px;
}

.header p{
font-size:22px;
}

.container{
max-width:900px;
margin:30px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.upload{
border:3px dashed #0d6efd;
padding:60px 20px;
text-align:center;
border-radius:15px;
}

.upload h2{
font-size:32px;
margin-bottom:30px;
}

button{
background:#0d6efd;
color:white;
border:none;
padding:14px 35px;
font-size:20px;
border-radius:8px;
cursor:pointer;
margin-top:20px;
}

button:hover{
opacity:.9;
}
</style>

</head>
<body>

<div class="header">
<h1>Compress PDF Tool</h1>
<p>Reduce PDF file size without losing quality</p>
</div>

<div class="container">

<div class="upload">

<h2>Select PDF File</h2>

<input type="file" accept=".pdf">

<br><br>

<button onclick="alert('PDF Compress Function Coming Soon')">
Compress PDF
</button>

</div>

</div>

</body>
</html>
