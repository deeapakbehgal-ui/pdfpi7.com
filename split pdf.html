<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split PDF Tool</title>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
}

.header{
background:#0d6efd;
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:800px;
margin:30px auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.upload{
border:2px dashed #0d6efd;
padding:40px;
text-align:center;
border-radius:10px;
}

input{
padding:10px;
margin-top:10px;
}

button{
background:#0d6efd;
color:white;
border:none;
padding:12px 25px;
border-radius:6px;
cursor:pointer;
margin-top:15px;
}

#downloadBtn{
display:none;
}
</style>
</head>

<body>

<div class="header">
<h1>Split PDF Tool</h1>
<p>Extract pages from PDF easily</p>
</div>

<div class="container">
<div class="upload">

<h2>Select PDF File</h2>

<input type="file" id="pdfFile" accept=".pdf">

<br><br>

<label>Page Number:</label>
<br>

<input type="number" id="pageNumber" min="1">

<br><br>

<button onclick="splitPDF()">Split PDF</button>

<br>

<button id="downloadBtn">
Download PDF
</button>

</div>
</div>

<script>

let splitPdfBytes;

async function splitPDF(){

const file=document.getElementById("pdfFile").files[0];

if(!file){
alert("Select PDF First");
return;
}

const pageNumber=parseInt(
document.getElementById("pageNumber").value
);

if(!pageNumber){
alert("Enter Page Number");
return;
}

const bytes=await file.arrayBuffer();

const pdfDoc=await PDFLib.PDFDocument.load(bytes);

const totalPages=pdfDoc.getPageCount();

if(pageNumber<1 || pageNumber>totalPages){
alert("Invalid Page Number");
return;
}

const newPdf=await PDFLib.PDFDocument.create();

const [page]=await newPdf.copyPages(
pdfDoc,
[pageNumber-1]
);

newPdf.addPage(page);

splitPdfBytes=await newPdf.save();

document.getElementById("downloadBtn").style.display="inline-block";

alert("PDF Split Successfully");
}

document.getElementById("downloadBtn").onclick=function(){

const blob=new Blob(
[splitPdfBytes],
{type:"application/pdf"}
);

const link=document.createElement("a");

link.href=URL.createObjectURL(blob);

link.download="split.pdf";

link.click();
};

</script>

</body>
</html>
