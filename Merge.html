<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merge PDF Tool</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:0;
}

.header{
background:#0d6efd;
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:800px;
margin:30px auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.upload{
border:2px dashed #0d6efd;
padding:40px;
text-align:center;
border-radius:10px;
}

button{
background:#0d6efd;
color:white;
border:none;
padding:12px 20px;
border-radius:5px;
margin-top:15px;
cursor:pointer;
}

button:hover{
opacity:.9;
}
</style>
</head>
<body>

<div class="header">
<h1>Merge PDF Tool</h1>
<p>Combine multiple PDF files into one PDF</p>
</div>

<div class="container">

<div class="upload">
<h2>Select PDF Files</h2>

<input type="file" multiple accept=".pdf">

<br>

<button onclick="alert('PDF Merge Function Coming Soon')">
Merge PDFs
</button>

</div>

</div>

</body>
</html>
