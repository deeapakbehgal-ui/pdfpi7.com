<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split PDF - PDFPi7</title>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f6f9;
padding:20px;
text-align:center;
}
.container{
max-width:700px;
margin:auto;
background:#fff;
padding:25px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}
input,button{
padding:10px;
margin:10px;
}
button{
background:#0d6efd;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}
</style>
</head>
<body>

<div class="container">
<h1>Split PDF</h1>

<input type="file" id="pdfFile" accept=".pdf">

<p id="pageCount"></p>

<div id="options" style="display:none;">
<label>Start Page:</label>
<input type="number" id="startPage" min="1">

<label>End Page:</label>
<input type="number" id="endPage" min="1">

<br>

<button onclick="splitPDF()">Split PDF</button>
</div>
</div>

<script>
let pdfBytes;
let totalPages = 0;

document.getElementById('pdfFile').addEventListener('change', async function(e){

const file = e.target.files[0];
if(!file) return;

pdfBytes = await file.arrayBuffer();

const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);

totalPages = pdfDoc.getPageCount();

document.getElementById('pageCount').innerHTML =
"Total Pages: " + totalPages;

document.getElementById('startPage').max = totalPages;
document.getElementById('endPage').max = totalPages;

document.getElementById('options').style.display='block';

});

async function splitPDF(){

const start = parseInt(document.getElementById('startPage').value);
const end = parseInt(document.getElementById('endPage').value);

if(!start || !end || start > end || end > totalPages){
alert("Invalid page range");
return;
}

const srcDoc = await PDFLib.PDFDocument.load(pdfBytes);

const newDoc = await PDFLib.PDFDocument.create();

for(let i=start-1;i<end;i++){
const [page] = await newDoc.copyPages(srcDoc,[i]);
newDoc.addPage(page);
}

const pdfData = await newDoc.save();

const blob = new Blob([pdfData], {type:'application/pdf'});

const link = document.createElement('a');
link.href = URL.createObjectURL(blob);
link.download = 'split.pdf';
link.click();
}
</script>

</body>
</html>
