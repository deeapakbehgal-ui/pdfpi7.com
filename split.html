<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split PDF Tool - PDFPi7</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:0;
}

.header{
background:#0d6efd;
color:white;
text-align:center;
padding:60px 20px;
}

.header h1{
font-size:50px;
margin:0;
}

.header p{
font-size:20px;
margin-top:20px;
}

.container{
max-width:900px;
margin:50px auto;
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.upload{
border:3px dashed #0d6efd;
padding:60px 20px;
text-align:center;
border-radius:20px;
}

.upload h2{
font-size:40px;
margin-bottom:30px;
}

input[type=file]{
margin:20px 0;
font-size:18px;
}

input[type=number]{
padding:10px;
width:120px;
font-size:18px;
margin-top:20px;
}

button{
background:#0d6efd;
color:white;
border:none;
padding:15px 40px;
font-size:24px;
border-radius:8px;
cursor:pointer;
margin-top:25px;
}

button:hover{
opacity:.9;
}

#pages{
font-size:24px;
margin-top:20px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
<h1>Split PDF Tool</h1>
<p>Extract specific pages from your PDF file</p>
</div>

<div class="container">

<div class="upload">

<h2>Select PDF File</h2>

<input type="file" id="pdfFile" accept=".pdf">

<div id="pages"></div>

<br>

<label><b>Page Number:</b></label><br>
<input type="number" id="pageNumber" min="1">

<br>

<button onclick="splitPDF()">Split PDF</button>

</div>

</div>

<script>
document.getElementById("pdfFile").addEventListener("change", function(){
document.getElementById("pages").innerHTML =
"PDF Selected Successfully";
});

function splitPDF(){
let page=document.getElementById("pageNumber").value;

if(page==""){
alert("Enter Page Number");
return;
}

alert("PDF Split Function Coming Soon");
}
</script>

</body>
</html>
